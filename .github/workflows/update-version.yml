name: Update version

on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version bump
        required: true
        default: patch
        options: [patch, minor, major]
      changelog:
        type: string
        description: Changelog (English, shown in the App Store)
        required: true
      publish:
        type: boolean
        description: Upload the new version to the Homey developer dashboard
        default: true

permissions:
  contents: write

jobs:
  version:
    name: Update version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.update.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Update Homey app version
        id: update
        uses: athombv/github-action-homey-app-version@v2
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}

      - name: Commit, tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Homey app version to v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD --tags
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes

  # A release created with GITHUB_TOKEN doesn't trigger other workflows, so call Publish directly.
  publish:
    name: Publish
    needs: version
    if: ${{ inputs.publish }}
    uses: ./.github/workflows/publish.yml
    with:
      ref: v${{ needs.version.outputs.version }}
    secrets: inherit
